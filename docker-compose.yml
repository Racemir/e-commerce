services:

  # Veritabanı servisim
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: ecommerce
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d ecommerce"]
      interval: 3s
      timeout: 5s
      retries: 10

  # Redis servisim
  redis:
    image: redis:8.8-alpine
    ports:
      - "6379:6379"

  # Mailpit servisim
  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

  # Go uygulamam
  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env

  worker:
    build: .
    command: [ "./ecommerce", "worker" ]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env